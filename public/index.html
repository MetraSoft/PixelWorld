<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelWorld</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>▦ PixelWorld <small>v0.1</small></strong><nav><button id="studioTab">Studio</button><button id="discoverTab">Discover</button><span id="identity"></span><button id="logout" hidden>Log out</button></nav></header><main><section id="auth"><h1>Build your pixel world.</h1><p>Create an account to save projects in the cloud.</p><form id="authForm"><input id="username" placeholder="Username" autocomplete="username" required minlength="3" maxlength="30"><input id="password" type="password" placeholder="Password (12+ characters)" autocomplete="current-password" required minlength="12"><button id="authSubmit">Log in</button></form><button id="toggleAuth" class="link">Need an account? Register</button></section><section id="studio" hidden><div class="bar"><h2>My projects</h2><button id="newProject">+ New project</button></div><div id="projects" class="cards"></div><section id="editor" hidden><div class="bar"><input id="title" maxlength="80" aria-label="Project title"><label><input type="checkbox" id="isPublic"> Published</label><button id="save">Save to cloud</button></div><div class="workspace"><aside><label>Paint color <input type="color" id="color" value="#7c3aed"></label><button id="eraser">Eraser</button><button id="clear">Clear</button><p>16 × 16 pixels</p><p>Click or drag to paint.</p></aside><canvas id="canvas" width="512" height="512" aria-label="Pixel art editor"></canvas></div></section></section><section id="discover" hidden><h2>Discover published worlds</h2><div id="publicProjects" class="cards"></div><section id="player" hidden><h3 id="playTitle"></h3><canvas id="playCanvas" width="512" height="512"></canvas><p>v0.1 launches published pixel scenes. Interactive games come in a later version.</p></section></section><p id="message" role="status"></p></main><script src="/app.js" defer></script></body></html>
